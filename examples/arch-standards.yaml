security:
  - id: SEC-S01
    name: Authentication required on all endpoints
    type: standard
    source: owasp
    rationale: All API routes require authentication. Fail-closed on error.
    addressed_by: [ARCH-AUTH-001, ARCH-AUTH-003, ADR-015]

  - id: SEC-S02
    name: Data scoped to authenticated user (fail-closed)
    type: standard
    source: owasp
    rationale: Users only see data they are authorised for. On scope error — empty, not all.
    addressed_by: [ARCH-AUTH-002]

  - id: SEC-S03
    name: Secrets in environment variables only
    type: standard
    source: 12-factor
    addressed_by: [ADR-026, ADR-035, ARCH-AI-001]

  - id: SEC-S04
    name: Admin functions on isolated surface
    type: standard
    source: internal
    addressed_by: [ADR-017]

  - id: SEC-S05
    name: Inter-service calls authenticated
    type: standard
    source: internal
    addressed_by: [ARCH-AI-001]

  - id: SEC-S06
    name: Input validation at all system boundaries
    type: standard
    source: owasp
    addressed_by: [ARCH-NEO-001]

  - id: SEC-BP01
    name: Principle of least privilege for all roles
    type: best-practice
    source: nist
    addressed_by: [ADR-018]

  - id: SEC-BP02
    name: Audit log for all write operations
    type: best-practice
    source: nist
    addressed_by: []

  - id: SEC-BP03
    name: Rate limiting on authentication endpoints
    type: best-practice
    source: owasp
    addressed_by: []

  - id: SEC-BP04
    name: OWASP Top 10 review before major releases
    type: best-practice
    source: owasp
    addressed_by: []

