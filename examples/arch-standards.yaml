# SysEdge Architecture Standards — seed file
# Load with: python3 cli/sys_edge.py seed-standards arch-standards.yaml
#
# These are the architecture and quality standards across 6 domains that
# SysEdge uses for architecture auditing and requirements/test adequacy.
# Customise for your project — add, remove, or adjust compliance notes to
# match your stack. The quality domain seeds the AS-REQ/AS-TEST dimensions
# used by coverage-review and audit-test.
#
# Sources: 12-factor (12f), OWASP, NIST CSF, Google SRE, cloud-native (cn)

# addressed_by: lists the IDs of SysArchDecision (ADR-NNN) or SysArchStd (ARCH-*)
# nodes that address this standard. seed-standards creates ADDRESSES edges
# automatically. Leave empty ([]) until you have made a decision.

execution:
  - id: EXEC-S01
    name: Stateless backend services
    type: standard
    source: 12-factor
    rationale: Stateless services scale horizontally; auth context carried in requests.
    complianceNote: No in-memory session state in handlers.
    addressed_by: [ADR-024]

  - id: EXEC-S02
    name: Request correlation IDs
    type: standard
    source: 12-factor
    rationale: Per-request trace IDs correlate logs across services.
    complianceNote: X-Request-ID propagated; included in every log record.
    addressed_by: [ADR-028]

  - id: EXEC-S03
    name: Graceful shutdown with request drain
    type: standard
    source: 12-factor
    rationale: Complete in-flight requests before exiting on SIGTERM.
    complianceNote: Signal handler with drain timeout in each service binary.
    addressed_by: [ADR-029]

  - id: EXEC-S04
    name: Async pattern for long-running operations
    type: standard
    source: internal
    rationale: Synchronous long ops risk timeouts and duplicate requests.
    complianceNote: Fire-and-forget with job ID polling for ops >5s.
    addressed_by: [ARCH-AI-002]

  - id: EXEC-S05
    name: Database connection pooling
    type: standard
    source: internal
    rationale: Per-request connection creation exhausts database limits.
    complianceNote: Single driver/pool, session-per-request.
    addressed_by: [ADR-030]

  - id: EXEC-BP01
    name: Horizontal scalability — no sticky sessions
    type: best-practice
    source: 12-factor
    addressed_by: [ADR-024]

  - id: EXEC-BP02
    name: Circuit breaker for external service calls
    type: best-practice
    source: microservices
    addressed_by: []

  - id: EXEC-BP03
    name: Idempotent write operations
    type: best-practice
    source: microservices
    addressed_by: [ARCH-MERGE-001]

development:
  - id: DEV-S01
    name: Explicit permission check on all API endpoints
    type: standard
    source: owasp
    rationale: Missing permission checks are the most common privilege escalation vector.
    complianceNote: Every route has explicit permission/role check — no open endpoints.
    addressed_by: [ARCH-AUTH-003]

  - id: DEV-S02
    name: Parameterised database queries — no string interpolation
    type: standard
    source: owasp
    rationale: String interpolation creates injection vectors.
    complianceNote: No fmt.Sprintf/string concat in query building.
    addressed_by: [ARCH-NEO-001]

  - id: DEV-S03
    name: Module isolation — no cross-module code imports
    type: standard
    source: clean-architecture
    rationale: Cross-module imports create tight coupling.
    addressed_by: [ADR-003, ADR-019, ARCH-PICK-001]

  - id: DEV-S04
    name: All user-facing strings use i18n keys
    type: standard
    source: internal
    addressed_by: []

  - id: DEV-S05
    name: Standardised error shape across all endpoints
    type: standard
    source: internal
    addressed_by: [ARCH-ERR-001]

  - id: DEV-S06
    name: V-model test coverage — component, integration, usecase, e2e
    type: standard
    source: v-model
    rationale: Each specification artefact has a corresponding verification artefact.
    addressed_by: [ADR-027]

  - id: DEV-BP01
    name: Code maps kept current with exported surface
    type: best-practice
    source: internal
    addressed_by: []

  - id: DEV-BP02
    name: Schema/model changes go via config or YAML, not code
    type: principle
    source: internal
    addressed_by: [ADR-005]

  - id: DEV-BP03
    name: Accept imperfect data — recommend, do not block
    type: principle
    source: internal
    addressed_by: [ADR-025]

